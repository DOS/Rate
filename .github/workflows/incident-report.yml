name: Incident report

# The incident inbox for agents (DOS/Rate#1057). When CI fails on dev or main,
# open an `incident` issue (or comment on the open one) with the run, commit
# and failing jobs; when it passes again, close that issue. Agents treat an
# open `incident` issue as their first priority (AGENTS.md).
# workflow_run only fires for this file as it is on the default branch (dev).
on:
  workflow_run:
    workflows: ['Verify Build & Typecheck (Zero-Strapi 2026)']
    types: [completed]
    branches: [dev, main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: incident-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Open or close the incident issue
    # Only branch pushes: pull request runs are reported on the PR itself.
    # `cancelled` counts as a failure: CI never cancels a push run itself, so
    # it means a job hit its timeout (or someone stopped a hung run).
    if: github.event.workflow_run.event == 'push' && contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      COMMIT_TITLE: ${{ github.event.workflow_run.head_commit.message }}
    steps:
      - name: Open, update or close the incident
        run: |
          set -euo pipefail
          # Events can arrive out of order: only the run of the branch's
          # current head speaks for the branch, so a stale failure never
          # reopens an incident a newer run has closed.
          head="$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)"
          if [ "$head" != "$SHA" ]; then
            echo "Run is for ${SHA:0:8}, ${BRANCH} is at ${head:0:8} now: skipped."
            exit 0
          fi

          title="incident: ${WORKFLOW} failing on ${BRANCH}"
          # Untrusted text, shown as inline code so its @mentions and #refs
          # ping or link nothing (backticks removed so it cannot close the span).
          subject="\`$(printf '%s' "${COMMIT_TITLE}" | head -n 1 | cut -c1-120 | tr -d '\`')\`"
          gh label create incident -R "$REPO" --color B60205 \
            --description "Production or CI breakage: first priority for any free agent" 2>/dev/null || true
          # Read the list first so an API error fails the step (pipefail does
          # not cover process substitution) instead of creating a duplicate.
          list="$(gh issue list -R "$REPO" --state open --label incident --limit 50 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"')"
          open=""
          while IFS=$'\t' read -r num t; do
            if [ "$t" = "$title" ]; then open="$num"; break; fi
          done <<< "$list"

          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$REPO" --body "Recovered: ${RUN_URL} passed on \`${SHA:0:8}\` (${subject})."
              gh issue close "$open" -R "$REPO" --reason completed
            fi
            exit 0
          fi

          failing="$(gh run view "$RUN_ID" -R "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .name] | join(", ")')"
          body="$(printf '%s\n' \
            "**${WORKFLOW}** ${CONCLUSION} on \`${BRANCH}\`." \
            "" \
            "- Run: ${RUN_URL}" \
            "- Commit: \`${SHA:0:8}\` ${subject}" \
            "- Failing jobs: ${failing:-unknown}" \
            "" \
            "Agents: this is the first priority (AGENTS.md). Claim it, find the breaking change, fix forward. The issue closes itself when the workflow passes on \`${BRANCH}\` again.")"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --label incident --body "$body"
          fi
