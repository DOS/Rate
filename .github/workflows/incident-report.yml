name: Incident report

# The incident inbox for agents (DOS/Rate#1057). When CI fails on dev or main,
# open an `incident` issue (or comment on the open one) with the run, commit
# and failing jobs; when every failing job passes again, close that issue
# (scripts/ops/incident-report.mjs). Agents treat an open `incident` issue
# as their first priority (AGENTS.md).
# workflow_run only fires for this file as it is on the default branch (dev).
on:
  workflow_run:
    workflows: ['Verify Build & Typecheck (Zero-Strapi 2026)']
    types: [completed]
    branches: [dev, main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: incident-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Open or close the incident issue
    # Only branch pushes: pull request runs are reported on the PR itself.
    # `cancelled` counts as a failure: CI never cancels a push run itself, so
    # it means a job hit its timeout (or someone stopped a hung run).
    if: github.event.workflow_run.event == 'push' && contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      COMMIT_TITLE: ${{ github.event.workflow_run.head_commit.message }}
    steps:
      # The script comes from the default branch (workflow_run runs there),
      # never from the run's commit: no untrusted code gets the token.
      - name: Check out the incident script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      # Closes only when every job that failed has concluded `success` again:
      # a job skipped on a later push proves nothing (DOS/Rate#1134).
      - name: Open, update or close the incident
        run: node scripts/ops/incident-report.mjs
