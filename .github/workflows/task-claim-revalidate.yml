name: Task Claim Revalidate

# Re-runs the task-claim check (task-claim.yml) on every open PR into dev that
# closes an issue whose agent:* or status:* labels just changed. Kept in its
# own workflow so PR check lists do not show a skipped revalidate job.
#
# Runs from the default branch (dev) on issue events; no PR code is involved.
# Concurrency is per job: every issue label event starts a run, and a
# workflow-level group would let an unrelated label cancel a pending
# revalidation before the job `if:` is evaluated.

on:
  issues:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  revalidate:
    name: Re-run task-claim for PRs closing this issue
    if: >-
      startsWith(github.event.label.name, 'agent:') ||
      startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: task-claim-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      issues: read
      pull-requests: read
    steps:
      # A re-run keeps the run's PR head, so it only counts for the required
      # check when it is the run for the PR's current head; match on head_sha.
      - name: Re-run the task-claim run of each affected PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          owner=${REPO%/*}; name=${REPO#*/}
          prs=$(gh api graphql -F owner="$owner" -F name="$name" -F number="$ISSUE" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) {
                  closedByPullRequestsReferences(first: 25, includeClosedPrs: false) {
                    nodes { number baseRefName headRefOid repository { nameWithOwner } }
                  }
                }
              }
            }' --jq '.data.repository.issue.closedByPullRequestsReferences.nodes[]
                    | select(.baseRefName == "dev" and .repository.nameWithOwner == env.REPO)
                    | "\(.number) \(.headRefOid)"')
          if [[ -z "$prs" ]]; then
            echo "No open PR into dev closes #$ISSUE."
            exit 0
          fi
          while read -r pr sha; do
            runs="repos/$REPO/actions/workflows/task-claim.yml/runs?event=pull_request_target&head_sha=$sha&per_page=1"
            read -r id status < <(gh api "$runs" --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"') || true
            if [[ -z "${id:-}" ]]; then
              echo "::warning::PR #$pr has no task-claim run for its head $sha; push or edit the PR to start one."
              continue
            fi
            # A run that is still going cannot be re-run, and it may have read
            # the labels before this change. Let it finish first.
            if [[ "$status" != "completed" ]]; then
              timeout 300 gh run watch "$id" -R "$REPO" < /dev/null > /dev/null || true
            fi
            echo "Re-running task-claim run $id for PR #$pr ($sha)"
            gh run rerun "$id" -R "$REPO" < /dev/null || echo "::warning::Could not re-run $id for PR #$pr"
            unset id status
          done <<< "$prs"
