name: Verify Build & Typecheck (Zero-Strapi 2026)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

jobs:
  verify:
    name: Typecheck & Build Monorepo
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: '${{ runner.os }}-turbo-${{ github.sha }}'
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay rate migrations on PostgreSQL 17 (Docker)
        run: node scripts/test-migration-replay.mjs

      - name: Build @repo/shared-data
        run: pnpm --filter @repo/shared-data build

      - name: Build & Typecheck @repo/crawlers
        run: pnpm --filter @repo/crawlers build

      - name: Run @repo/crawlers Open-Core Intelligence Tests
        run: pnpm --filter @repo/crawlers test

      - name: Lint @repo/crawlers (errors fail, warnings do not)
        run: pnpm --filter @repo/crawlers lint

      - name: Verify @repo/crawlers dist entry points (consumed by DOS/Rate-Services)
        run: pnpm --filter @repo/crawlers test:dist

      - name: Build & Typecheck @repo/extension (MV3)
        run: pnpm --filter @repo/extension build

      - name: Run @repo/extension E2E Pipeline Tests
        run: pnpm --filter @repo/extension test

      - name: Typecheck @repo/web
        run: pnpm --filter @repo/web typecheck

      - name: Lint @repo/web (errors fail, warnings do not)
        run: pnpm --filter @repo/web lint

      - name: Run @repo/web Core Architecture Tests
        run: pnpm --filter @repo/web test

      - name: Build @repo/web (Next.js 16)
        run: pnpm --filter @repo/web build
