name: Verify Build & Typecheck (Zero-Strapi 2026)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

jobs:
  verify:
    name: Typecheck & Build Monorepo
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: '${{ runner.os }}-turbo-${{ github.sha }}'
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @repo/shared-data
        run: pnpm --filter @repo/shared-data build

      - name: Build & Typecheck @repo/crawlers
        run: pnpm --filter @repo/crawlers build

      - name: Run @repo/crawlers Open-Core Intelligence Tests
        run: pnpm --filter @repo/crawlers test

      - name: Typecheck @repo/web
        run: pnpm --filter @repo/web typecheck

      - name: Run @repo/web Core Architecture Tests
        run: pnpm --filter @repo/web test

      - name: Build @repo/web (Next.js 16)
        run: pnpm --filter @repo/web build
