name: Secret scan

# Scans only the commits a pull request adds. GitHub secret scanning and push
# protection are blocked for this repo by the enterprise policy (DOS/Rate#191).
# The history was rewritten on 2026-10-18 to remove old secrets (DOS/Rate#153);
# the remaining full-history findings are public values and test fixtures.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the pull request with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The history was rewritten on 2026-10-18 to remove leaked secrets
      # (DOS/Rate#153). ceebf97 was the root commit of the old history, so a
      # branch that merged it back in would restore those secrets, including
      # SQL dumps gitleaks does not flag.
      - name: Refuse branches built on the pre-purge history
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          OLD_ROOT: ceebf975bc9b97467ba11f90388b9995a45d1a5d
        run: |
          # Fail closed: is-ancestor also exits 128 for a missing head commit.
          git cat-file -e "${HEAD_SHA}^{commit}"
          if git merge-base --is-ancestor "$OLD_ROOT" "$HEAD_SHA" 2>/dev/null; then
            echo "::error::This branch contains the pre-2026-10-18 history that still has leaked secrets. Rebuild it on origin/${BASE_REF} and cherry-pick your commits (see DOS/Rate#153)."
            exit 1
          fi

      # Catches files that .gitignore covers (env copies, SQL dumps, captured
      # headers) but were added anyway, with "git add -f" or a replayed commit.
      - name: Refuse tracked files that .gitignore covers
        run: |
          ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "::error::These tracked files match .gitignore and may hold secrets or local data:"
            echo "$ignored"
            exit 1
          fi

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits this pull request adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --verbose --no-banner --exit-code 1 .
