<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The consent screen shown once at install (DOS/Rate#1603). Text comes
       from _locales through data-i18n* at load. -->
    <title>Rate.vn</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --border: #d7dbe2;
        --text: #14171c;
        --muted: #4b5563;
        --accent: #b42323;
        --focus: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1113;
          --card: #16191e;
          --border: #2a2f3a;
          --text: #f3f4f6;
          --muted: #b6bcc6;
          --accent: #f87171;
          --focus: #60a5fa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 1.1rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }
      button.primary {
        background: var(--text);
        color: var(--card);
        border-color: var(--text);
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.7;
      }
      #status {
        margin-top: 16px;
        font-weight: 600;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1 data-i18n="onboardingTitle"></h1>
        <p data-i18n="onboardingLookup"></p>
        <h2 data-i18n="onboardingQuestion"></h2>
        <p data-i18n="optInBody"></p>
        <p class="muted" data-i18n="onboardingNothingYet"></p>
        <div class="choices">
          <button
            type="button"
            id="btn-no"
            class="primary"
            data-i18n="onboardingNo"
            autofocus
          ></button>
          <button type="button" id="btn-yes" data-i18n="onboardingYes"></button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="muted">
          <a
            href="https://rate.vn/privacy-policy"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="onboardingPrivacyLink"
          ></a>
        </p>
      </div>
    </main>
    <script type="module" src="onboarding.js"></script>
  </body>
</html>
